# One prebuilt image: web app + API on :8080. SearXNG (web search) is included
# and runs automatically. Langfuse (agent tracing) is opt-in:
# `docker compose --profile langfuse up -d`. Postgres is the legacy cloud path.
services:
  app:
    image: ghcr.io/relativityai/relativity-markets:latest
    # Uncomment to build the image locally instead of pulling it:
    # build: .
    ports:
      - "8080:8080"
    env_file:
      - path: ./services/.env
        required: false
    environment:
      SEARXNG_URL: http://searxng:8080
      # Local-first: state is the SAME SQLite file local dev uses
      # (services/data/relativity.db) — runs, agents, keys are shared.
      SQLITE_PATH: /app/data/relativity.db
      # Tracing hits the local Langfuse when the profile is up; unset keys
      # keep tracing off entirely.
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./services/data:/app/data
    depends_on:
      - searxng

  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro

  langfuse:
    profiles: [langfuse]
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: changeme-nextauth-secret
      SALT: changeme-salt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"

  langfuse-db:
    profiles: [langfuse]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    profiles: [legacy]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relativity
    ports:
      - "5432:5432"
    volumes:
      - relativity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relativity"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relativity-pgdata:
  langfuse-pgdata:
