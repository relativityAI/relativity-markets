# One prebuilt image: web app + API on :8080. SearXNG (web search) is included
# and runs automatically. Postgres is the legacy cloud path (AUTH_MODE=supabase)
# — not used in local-first mode.
services:
  app:
    image: ghcr.io/relativityai/relativity-markets:latest
    # Uncomment to build the image locally instead of pulling it:
    # build: .
    ports:
      - "8080:8080"
    env_file:
      - path: ./services/.env
        required: false
    environment:
      SEARXNG_URL: http://searxng:8080
      # Local-first: state is a SQLite file (mount to keep it).
      SQLITE_PATH: /app/data/relativity.db
    volumes:
      - relativity-sqldata:/app/data
    depends_on:
      - searxng

  searxng:
    image: docker.io/searxng/searxng:latest
    ports:
      - "8888:8080"
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml:ro

  postgres:
    profiles: [legacy]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relativity
    ports:
      - "5432:5432"
    volumes:
      - relativity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relativity"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relativity-sqldata:
  relativity-pgdata:
