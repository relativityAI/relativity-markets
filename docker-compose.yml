# One prebuilt image: web app + API on :8501. SearXNG (web search) is included
# and runs automatically. Langfuse (agent tracing) is opt-in:
# `docker compose --profile langfuse up -d` (it brings its own Postgres).
services:
  app:
    image: ghcr.io/relativityai/relativity-markets:latest
    # Uncomment to build the image locally instead of pulling it:
    # build: .
    ports:
      # Loopback only — the app has no sign-in and stores API keys.
      - "127.0.0.1:8501:8501"
    env_file:
      - path: ./services/.env
        required: false
    environment:
      PORT: 8501
      SEARXNG_URL: http://searxng:8080
      # Agent toolbox MCP urls (all streamable HTTP, internal network only).
      MCP_YFINANCE_URL: http://yfmcp:8000/mcp
      MCP_SEARXNG_MCP_URL: http://searxng-mcp:3000/mcp
      MCP_TRADINGVIEW_URL: http://tvmcp:8000/mcp
      # Local-first: state is the SAME SQLite file local dev uses
      # (services/data/relativity.db) — runs, agents, keys are shared.
      SQLITE_PATH: /app/data/relativity.db
      # Tracing hits the local Langfuse when the profile is up; unset keys
      # keep tracing off entirely.
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./services/data:/app/data
    depends_on:
      - searxng
      - yfmcp
      - searxng-mcp
      - tvmcp

  # yfinance MCP server — the agent's market-data toolbox. The image's default
  # entrypoint is stdio; we override it to serve streamable HTTP so the API
  # connects over the network (verified: FastMCP run(transport)).
  yfmcp:
    image: narumi/yfinance-mcp:latest
    ports:
      # Local dev (services/.env) reaches it at http://localhost:8003/mcp.
      - "127.0.0.1:8003:8000"
    entrypoint:
      - python
      - -c
      - "from yfmcp.server import mcp; mcp.settings.host='0.0.0.0'; mcp.settings.transport_security.enable_dns_rebinding_protection=False; mcp.run(transport='streamable-http')"
    restart: unless-stopped

  # searxng-mcp — the agent's web-search toolbox, in front of the searxng
  # container. HTTP mode needs no auth; publish loopback only so local dev and
  # `npm run smoke:mcp` can reach it at the localhost URL in services/.env.
  searxng-mcp:
    image: isokoliuk/mcp-searxng:latest
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      SEARXNG_URL: http://searxng:8080
      # web_url_read sends NO User-Agent by default → 403 bot-block from
      # cnbc.com, investor.nvidia.com, etc. Browser UA fixes it; search traffic
      # keeps the server default (SEARCH_USER_AGENT unset).
      URL_READER_USER_AGENT: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36"
      # investor.nvidia.com 403s Node's TLS fingerprint regardless of headers —
      # hand the read to a real browser. Solver handles it; direct fetch remains
      # the fallback when the solver is down.
      FLARESOLVERR_URL: http://flaresolverr:8191
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_HOST: 0.0.0.0
    depends_on:
      - searxng
      - flaresolverr
    restart: unless-stopped

  # flaresolverr — real-Chrome fetch backend for web_url_read (bot-detection
  # sites). Internal network only, no published port.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      CAPTCHA_SOLVER: none
      TZ: UTC
    restart: unless-stopped

  # tvmcp — TradingView market-data/technical-analysis MCP, built from the
  # official PyPI package so we get the current TA/screener tools (the old
  # arm64 image only had 11 crypto scanners). News/sentiment degrade to a
  # "not configured" note without MARKETAUX_API_TOKEN.
  # Published by the `docker` workflow; to develop it locally:
  #   docker build -t ghcr.io/relativityai/tradingview-mcp:0.8.1 docker/tradingview-mcp
  tvmcp:
    image: ghcr.io/relativityai/tradingview-mcp:0.8.1
    command:
      - python
      - -c
      - "from tradingview_mcp.server import mcp; mcp.settings.host='0.0.0.0'; mcp.settings.port=8000; mcp.settings.transport_security.enable_dns_rebinding_protection=False; mcp.run(transport='streamable-http')"
    ports:
      - "127.0.0.1:8006:8000"
    environment:
      MARKETAUX_API_TOKEN: ${MARKETAUX_API_TOKEN:-}
    restart: unless-stopped

  # searxng — web search for the agent. Settings (JSON API, engine set) are
  # baked into the published image by docker/searxng/Dockerfile.
  searxng:
    image: ghcr.io/relativityai/relativity-searxng:latest
    ports:
      - "127.0.0.1:8888:8080"

  langfuse:
    profiles: [langfuse]
    image: langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: changeme-nextauth-secret
      SALT: changeme-salt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"

  langfuse-db:
    profiles: [langfuse]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  langfuse-pgdata:
