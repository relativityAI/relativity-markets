services:
  client:
    container_name: relativity-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - services

  services:
    container_name: relativity-services
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: ./services/.env
    environment:
      PORT: 8080
      SEARXNG_URL: http://searxng:8080
      # Local-first: state is a SQLite file inside the container (mount to keep it).
      SQLITE_PATH: /app/data/relativity.db
    volumes:
      - relativity-sqldata:/app/data

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./services/searxng/settings.yml:/etc/searxng/settings.yml

  # Legacy cloud path — kept for AUTH_MODE=supabase; unused in local-first mode.
  postgres:
    image: postgres:16-alpine
    container_name: relativity-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: relativity
    ports:
      - "5432:5432"
    volumes:
      - relativity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d relativity"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relativity-sqldata:
  relativity-pgdata:
