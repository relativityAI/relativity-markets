version: 2
updates:
  - package-ecosystem: npm
    directory: "/client"
    schedule:
      interval: weekly
    groups:
      client-minor-and-patch:
        update-types:
          - minor
          - patch
        # @assistant-ui/* internals break under the package.json overrides
        # when bumped in bulk (exports drift) — updates individually.
        exclude-dependency-name: "@assistant-ui/*"
      # Majors batch too: one PR per directory instead of one per dependency.
      client-major:
        update-types:
          - major
        exclude-dependency-name: "@assistant-ui/*"
    ignore:
      # TS7 is the Go-based rewrite — migrate deliberately, not via dependabot.
      - dependency-name: typescript
        versions: [">=7"]
      # motion 14 is a major UI-animation upgrade — visual regressions are
      # invisible to CI; upgrade deliberately.
      - dependency-name: motion
        versions: [">=14"]
  - package-ecosystem: npm
    directory: "/services"
    schedule:
      interval: weekly
    groups:
      services-minor-and-patch:
        update-types:
          - minor
          - patch
        # langfuse 6.x pulls an @opentelemetry/sdk-node that conflicts with
        # other pins in the group (npm ERESOLVE) — updates individually fine.
        exclude-dependency-name: "@langfuse/*"
      # Majors batch too: one PR per directory instead of one per dependency.
      services-major:
        update-types:
          - major
        exclude-dependency-name: "@langfuse/*"
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      # pdf-parse v2 is an API rewrite; revisit with code changes.
      - dependency-name: pdf-parse
        versions: [">=2"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns: ["*"]
