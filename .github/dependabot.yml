version: 2
updates:
  # npm workspaces: the root package.json owns client + services, and npm only
  # ever reads the ROOT package-lock.json. Pointing `directory` at /client or
  # /services made Dependabot rewrite the unused per-app lockfiles and leave the
  # real one stale, so every update PR died at `npm ci`.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          # @assistant-ui/* internals break under the package.json overrides
          # when bumped in bulk (exports drift) — updates individually.
          - "@assistant-ui/*"
          # langfuse 6.x pulls an @opentelemetry/sdk-node that conflicts with
          # other pins in the group (npm ERESOLVE) — updates individually fine.
          - "@langfuse/*"
      # Majors batch too: one PR instead of one per dependency.
      major:
        update-types:
          - major
        exclude-patterns:
          - "@assistant-ui/*"
          - "@langfuse/*"
    ignore:
      # TS7 is the Go-based rewrite — migrate deliberately, not via dependabot.
      - dependency-name: typescript
        versions: [">=7"]
      # motion 14 is a major UI-animation upgrade — visual regressions are
      # invisible to CI; upgrade deliberately.
      - dependency-name: motion
        versions: [">=14"]
      # pdf-parse v2 is an API rewrite; revisit with code changes.
      - dependency-name: pdf-parse
        versions: [">=2"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns: ["*"]
