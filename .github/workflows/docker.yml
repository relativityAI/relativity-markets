name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SearXNG with this project's settings baked in (JSON API enabled,
      # engines widened) — published so `docker compose up` needs no checkout.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/searxng/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/relativityai/relativity-searxng:latest
          cache-from: type=gha,scope=searxng
          cache-to: type=gha,mode=max,scope=searxng

      # TradingView MCP — published so compose never has to build it locally.
      - uses: docker/build-push-action@v6
        with:
          context: docker/tradingview-mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/relativityai/tradingview-mcp:0.8.1
          cache-from: type=gha,scope=tvmcp
          cache-to: type=gha,mode=max,scope=tvmcp
