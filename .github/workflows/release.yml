name: release

# Publishes release artifacts for a version tag. Triggered by:
#  - push of a version tag (v0.1.0 / relativity-markets-v0.1.0 shapes)
#  - manual dispatch with a tag input (re-publish an existing release)
#  - workflow_call from release-please.yml (GITHUB_TOKEN-created tags don't
#    emit push events, so release-please calls this directly)
on:
  push:
    tags: ["v*", "*-v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. relativity-portfolio-v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client bundle
        run: npm ci && npm run build
        working-directory: client

      - name: Zip client bundle
        run: zip -r "relativity-client-${{ env.TAG }}.zip" dist
        working-directory: client

      - name: Attach bundle to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          # zip is created inside client/ — glob must match from the repo root
          files: client/relativity-client-${{ env.TAG }}.zip

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relativity-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v7
        with:
          context: ./services
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.TAG }}
            ${{ steps.img.outputs.name }}:latest
