name: release

# Runs when release-please pushes a vX.Y.Z tag (on merging the release PR).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client bundle
        run: npm ci && npm run build
        working-directory: client

      - name: Zip client bundle
        run: zip -r "relativity-client-${{ github.ref_name }}.zip" dist
        working-directory: client

      - name: Attach bundle to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: relativity-client-${{ github.ref_name }}.zip

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relativity-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./services
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
