name: release

# Runs when release-please pushes a version tag (on merging the release PR).
# release-please tags look like "relativity-portfolio-v0.1.0"; plain "v0.1.0"
# is accepted too. Can also be run manually with a tag input to (re)publish
# artifacts for an existing release.
on:
  push:
    tags: ["v*", "*-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. relativity-portfolio-v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build client bundle
        run: npm ci && npm run build
        working-directory: client

      - name: Zip client bundle
        run: zip -r "relativity-client-${{ env.TAG }}.zip" dist
        working-directory: client

      - name: Attach bundle to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: relativity-client-${{ env.TAG }}.zip

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/relativity-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v7
        with:
          context: ./services
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.TAG }}
            ${{ steps.img.outputs.name }}:latest
