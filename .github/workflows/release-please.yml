name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tag resolution needs `steps`, but a job that CALLS a reusable workflow
  # can't have any (steps.uses needs an action.yml; workflows are called
  # job-level only). So resolve the tag in its own job first.
  resolve-tag:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve tag
        id: tag
        run: |
          version=$(node -p "require('./.release-please-manifest.json')['.']")
          name=$(node -p "require('./package.json').name")
          echo "tag=${name}-v${version}" >> "$GITHUB_OUTPUT"

  publish:
    # GITHUB_TOKEN-created tags don't emit push events, so we can't rely on
    # release.yml's tag trigger — call it directly with the tag from the
    # manifest (the release PR just bumped it to the released version).
    needs: [release-please, resolve-tag]
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.resolve-tag.outputs.tag }}
